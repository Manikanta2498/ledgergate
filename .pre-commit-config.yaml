# Fast local gates. The full set runs in CI; these are the ones worth catching
# before a commit exists, especially gitleaks: cassettes are recorded network
# traffic, so a leaked credential must never reach the history in the first place.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # `language: script` executes the file through its own `#!/usr/bin/env python3`
  # shebang. `language: system` with `entry: python ...` was wrong: an installed Git
  # hook does not inherit the PATH that `uv run` sets up, and plenty of systems
  # (including macOS) ship `python3` with no bare `python` at all, so the hook failed
  # for every real commit while passing under `uv run pre-commit`.
  - repo: local
    hooks:
      - id: determinism
        name: ledger core determinism gate
        entry: scripts/check_determinism.py
        language: script
        pass_filenames: false
        files: ^src/ledgergate/ledger/

      - id: licenses
        name: per-file SPDX boundary gate
        entry: scripts/check_licenses.py
        language: script
        pass_filenames: false
        files: ^(src/ledgergate/|corpus/|schema/)
