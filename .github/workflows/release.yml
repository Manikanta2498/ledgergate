name: Release

# docs/spec/assurance.md, *Releases*. A tag v<version> publishes to PyPI; workflow_dispatch
# on main rehearses to TestPyPI. Order: gates (the CI workflow, whole) -> build and attest
# -> release assets (draft) -> index publish (the last irreversible step) -> publish the draft.
# Trusted publishing: the publisher (this repository, this file, the environment) is registered
# on the index; no token exists anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  refuse:
    name: tag, version, ancestry, changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout (full history for the ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version is the tag's, the ref is on main, the changelog has a section
        id: v
        run: |
          set -euo pipefail
          version="$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/ledgergate/__init__.py').read_text()).group(1))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            [[ "$tag" == "$version" ]] || { echo "tag v$tag is not __version__ $version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
          else
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "dispatch only from main"; exit 1; }
          fi
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "CHANGELOG.md has no dated section for $version"; exit 1; }

  gates:
    name: gates
    needs: refuse
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build and attest
    needs: [refuse, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Build the wheel and sdist
        run: uv build

      - name: Attest the wheel
        id: attest-wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Attest the sdist
        id: attest-sdist
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Build the corpus and schema tarball (Apache-2.0, outside the wheel and sdist)
        run: |
          set -euo pipefail
          v="${{ needs.refuse.outputs.version }}"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2026-01-01 00:00Z' \
            -czf "dist/ledgergate-corpus-$v.tar.gz" corpus schema LICENSES/Apache-2.0.txt

      - name: Attest the corpus tarball
        id: attest-corpus
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ledgergate-corpus-*.tar.gz

      - name: Collect the bundles as <artefact>.intoto.jsonl (one attest step per artefact)
        run: |
          set -euo pipefail
          mkdir -p bundles
          cp "${{ steps.attest-wheel.outputs.bundle-path }}" "bundles/$(basename dist/*.whl).intoto.jsonl"
          cp "${{ steps.attest-sdist.outputs.bundle-path }}" "bundles/$(basename dist/ledgergate-${{ needs.refuse.outputs.version }}.tar.gz).intoto.jsonl"
          cp "${{ steps.attest-corpus.outputs.bundle-path }}" "bundles/$(basename dist/ledgergate-corpus-*.tar.gz).intoto.jsonl"
          ls -l dist bundles

      - name: Upload build artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            bundles/

  release-assets:
    name: draft release with assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [refuse, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artefacts (never a rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Refuse if the version is already on PyPI (a re-run of all jobs would rebuild)
        run: |
          set -euo pipefail
          v="${{ needs.refuse.outputs.version }}"
          if curl -fsS "https://pypi.org/pypi/ledgergate/$v/json" >/dev/null 2>&1; then
            echo "ledgergate $v is already on PyPI; re-run failed jobs only"; exit 1
          fi

      - name: Create the draft release and upload assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" \
                 --notes "See CHANGELOG.md. The wheel and sdist are BUSL-1.1; ledgergate-corpus-*.tar.gz (corpus/ and schema/) is Apache-2.0. Every artefact has a provenance bundle beside it."
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/* bundles/*
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: publish to the index
    needs: [refuse, build, release-assets]
    if: always() && needs.build.result == 'success' && (needs.release-assets.result == 'success' || needs.release-assets.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - name: Download build artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Keep only the package artefacts
        run: rm -f dist/ledgergate-corpus-*.tar.gz && ls -l dist

      - name: Publish (trusted publishing, with attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ startsWith(github.ref, 'refs/tags/') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          attestations: true
          packages-dir: dist/

  smoke:
    name: install from TestPyPI and run the corpus
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [refuse, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for corpus/ and schema/, which are not in the wheel)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artefacts (for the wheel's dependency list)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Dependencies from PyPI only, then the package from TestPyPI only
        run: |
          set -euo pipefail
          v="${{ needs.refuse.outputs.version }}"
          python3 -m venv smoke && . smoke/bin/activate
          python -m pip install -q --upgrade pip
          python - <<'PY'
          import glob, subprocess, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              meta = next(n for n in z.namelist() if n.endswith("METADATA"))
              reqs = [l.split(":", 1)[1].strip() for l in z.read(meta).decode().splitlines() if l.startswith("Requires-Dist:")]
          reqs = [r for r in reqs if ";" not in r]  # no extras are needed for the smoke test
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "--index-url", "https://pypi.org/simple/", *reqs], check=True)
          PY
          for i in 1 2 3 4 5 6; do
            pip install -q --no-deps --index-url https://test.pypi.org/simple/ "ledgergate==$v" && break
            echo "not yet on the index, retrying"; sleep 30
          done
          ledgergate --version
          ledgergate run --corpus corpus --out result.json
          ledgergate report --conformance result.json --require L2

  publish-release:
    name: publish the draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make the release public
        run: gh release edit "${GITHUB_REF#refs/tags/}" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
