schema_version: '1'
id: post-and-reverse
kind: correct
title: Post a balanced entry and reverse it
description: The agent posts a fee accrual and then reverses it by reference.
scripted_only: false
setup:
  started_at: '2026-01-01T00:00:00Z'
  chart:
  - account_id: cash
    kind: asset
    currency: USD
  - account_id: revenue
    kind: revenue
    currency: USD
  - account_id: fees
    kind: expense
    currency: USD
  currencies: []
  policy:
    set: ledgergate.journal.policy.ThresholdPolicySet
    version: corpus-v1
    deny_above:
    - kind: open_transaction
      currency: USD
      amount: '100000'
    approve_above:
    - kind: open_transaction
      currency: USD
      amount: '50000'
    window_caps:
    - kind: refund
      currency: USD
      amount: '5000'
      window: 3600
    gated_reads: []
  before: []
  approvals:
    signing_key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
    approver: cfo
task:
  instruction: Post a balanced entry and reverse it
  attachments: []
agent:
  script:
  - tool: post
    key: a-1
    arguments:
      draft:
        postings:
        - account: fees
          side: debit
          money:
            amount: 250
            currency: USD
        - account: cash
          side: credit
          money:
            amount: 250
            currency: USD
  - tool: reverse
    key: a-2
    arguments:
      entry_ref: agent-1
      description: posted in error
