name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here needs write access; a job that does
# must elevate explicitly. Fork PRs run under `pull_request`, never
# `pull_request_target`, so they never see repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PR CI is replay-only. `auto` mode is rejected when CI=true so a pipeline can
  # never silently make a paid model call.
  LEDGERGATE_MODE: replay

jobs:
  check:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Actions are pinned by commit SHA. Tags are mutable, so a tag pin is not a pin.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Lint and format
        run: |
          uv run ruff format --check .
          uv run ruff check --output-format=github .

      - name: Types
        run: uv run mypy

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Ledger determinism gate
        run: uv run python scripts/check_determinism.py

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90
