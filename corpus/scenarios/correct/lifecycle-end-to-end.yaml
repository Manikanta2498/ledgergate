      currency: USD
      amount: '100000'
    approve_above:
    - kind: open_transaction
      currency: USD
      amount: '50000'
    window_caps:
    - kind: refund
      currency: USD
      amount: '5000'
      window: 3600
    gated_reads: []
  before: []
  approvals:
    signing_key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
    approver: cfo
task:
  instruction: Open, authorize, settle
  attachments: []
agent:
  script:
  - tool: open_transaction
    key: a-1
    arguments:
      transaction_id: t1
      amount:
        amount: 12000
        currency: USD
  - tool: advance
    key: a-2
    arguments:
      transaction_id: t1
      event: authorize
  - tool: advance
    key: a-3
