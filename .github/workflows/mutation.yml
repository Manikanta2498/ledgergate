name: Mutation gate

# docs/spec/assurance.md, *The mutation gate*: nightly on main and on demand, never per PR
# (a full run of the gated modules is minutes). The ratchet compares this run's unkilled
# mutants with .mutation-baseline.json; a red run on main is the gate. GitHub disables
# scheduled workflows after sixty days without activity; workflow_dispatch wakes it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  LEDGERGATE_MODE: replay

jobs:
  mutation:
    name: mutation ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Mutate the core and the registry
        run: |
          rm -rf mutants
          uv run mutmut run

      - name: Ratchet against the baseline
        run: uv run python scripts/mutation_gate.py gate

      - name: Keep the per-mutant results
        if: always()
        run: uv run mutmut results --all true > mutation-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results
          path: mutation-results.txt
