# Fast local gates. The full set runs in CI; these are the ones worth catching
# before a commit exists, especially gitleaks: cassettes are recorded network
# traffic, so a leaked credential must never reach the history in the first place.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # The local gates parse the ledger source, which uses 3.11+ syntax, so they must run
  # under the project interpreter, not whatever `python3` happens to be on PATH (macOS
  # ships 3.9, which cannot even parse a `match` statement). `uv run` selects the
  # project's Python and its environment; uv is already required to install these hooks.
  - repo: local
    hooks:
      - id: determinism
        name: ledger core determinism gate
        entry: uv run --no-sync python scripts/check_determinism.py
        language: system
        pass_filenames: false
        files: ^src/ledgergate/ledger/

      - id: licenses
        name: per-file SPDX boundary gate
        entry: uv run --no-sync python scripts/check_licenses.py
        language: system
        pass_filenames: false
        files: ^(src/ledgergate/|corpus/|schema/)
